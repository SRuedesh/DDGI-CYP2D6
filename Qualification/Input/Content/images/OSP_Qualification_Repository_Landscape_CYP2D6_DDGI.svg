<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CYP2D6 DDGI qualification repository and data flow</title>
  <desc id="desc">Interaction projects, parent models, observed data, narrative content, and report settings feed the CYP2D6 DDGI qualification plan, which is processed into the report.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L24,12 L0,24 Z" fill="#7FD100"/></marker>
    <marker id="arrow-blue" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L24,12 L0,24 Z" fill="#00A7E1"/></marker>
    <marker id="arrow-pink" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L24,12 L0,24 Z" fill="#E40046"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.2"/></filter>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#153C52}.heading{font:700 29px Arial,sans-serif;fill:#153C52}.boxheading{font:700 26px Arial,sans-serif;fill:#153C52}.body{font:23px Arial,sans-serif;fill:#153C52}.small{font:20px Arial,sans-serif;fill:#153C52}.white{fill:#fff}.box{stroke:#153C52;stroke-width:4;rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F4FAFC"/>
  <text x="70" y="68" class="title">CYP2D6 DDGI QUALIFICATION REPOSITORY</text>

  <rect x="60" y="125" width="360" height="190" fill="#7FD100" class="box"/>
  <text x="240" y="180" text-anchor="middle" class="heading">Interaction projects</text>
  <text x="240" y="230" text-anchor="middle" class="body">DDI and DDGI snapshots</text>
  <text x="240" y="270" text-anchor="middle" class="body">Control and interaction arms</text>

  <rect x="60" y="365" width="360" height="160" fill="#7FD100" class="box"/>
  <text x="240" y="425" text-anchor="middle" class="boxheading">Parent-model snapshots</text>
  <text x="240" y="475" text-anchor="middle" class="body">DGI simulations</text>

  <rect x="60" y="575" width="360" height="190" fill="#00A7E1" class="box"/>
  <text x="240" y="630" text-anchor="middle" class="heading white">Observed data</text>
  <text x="240" y="680" text-anchor="middle" class="body white">Concentration-time profiles</text>
  <text x="240" y="720" text-anchor="middle" class="body white">DDI, DGI, and DDGI ratio inputs</text>

  <path d="M420 220 H555" fill="none" stroke="#7FD100" stroke-width="12" marker-end="url(#arrow-green)"/>
  <path d="M420 445 H555" fill="none" stroke="#7FD100" stroke-width="12" marker-end="url(#arrow-green)"/>
  <path d="M420 670 H555" fill="none" stroke="#00A7E1" stroke-width="12" marker-end="url(#arrow-blue)"/>

  <rect x="585" y="105" width="430" height="690" fill="#FFFFFF" class="box"/>
  <rect x="585" y="105" width="430" height="88" fill="#153C52" rx="16"/>
  <text x="800" y="162" text-anchor="middle" class="heading white">Qualification plan</text>
  <text x="635" y="245" class="heading">Source references</text>
  <text x="665" y="290" class="body">• Versioned projects</text>
  <text x="665" y="330" class="body">• Observed-data records</text>
  <text x="635" y="400" class="heading">Execution specification</text>
  <text x="665" y="445" class="body">• Simulation mappings</text>
  <text x="665" y="485" class="body">• Output paths and windows</text>
  <text x="635" y="555" class="heading">Report specification</text>
  <text x="665" y="600" class="body">• Narrative modules</text>
  <text x="665" y="640" class="body">• Plot settings</text>
  <text x="665" y="680" class="body">• Qualification measures</text>
  <text x="665" y="720" class="body">• Section hierarchy</text>

  <path d="M1015 270 H1120" fill="none" stroke="#E40046" stroke-width="12" marker-end="url(#arrow-pink)"/>
  <rect x="1150" y="150" width="390" height="240" fill="#FFFFFF" class="box"/>
  <text x="1345" y="215" text-anchor="middle" class="heading">Qualification Runner</text>
  <text x="1345" y="260" text-anchor="middle" class="body">Resolve and prepare inputs</text>
  <text x="1345" y="320" text-anchor="middle" class="heading">Reporting Engine</text>
  <text x="1345" y="360" text-anchor="middle" class="body">Create figures and tables</text>

  <path d="M1345 390 V500" fill="none" stroke="#E40046" stroke-width="12" marker-end="url(#arrow-pink)"/>
  <path d="M1145 530 H1545 V720 H1145 Z" fill="#E40046" stroke="#153C52" stroke-width="4" filter="url(#shadow)"/>
  <text x="1345" y="600" text-anchor="middle" class="heading white">CYP2D6 DDGI</text>
  <text x="1345" y="642" text-anchor="middle" class="heading white">qualification report</text>
  <text x="1345" y="690" text-anchor="middle" class="small white">Ratios • profiles • measures</text>

  <rect x="585" y="825" width="430" height="54" fill="#DCECF2" stroke="#153C52" stroke-width="3" rx="12"/>
  <text x="800" y="860" text-anchor="middle" class="small">Versioned narrative and style assets</text>
  <path d="M800 825 V795" fill="none" stroke="#00A7E1" stroke-width="8" marker-end="url(#arrow-blue)"/>
</svg>
